[workspace]
members = [".", "macros"]
resolver = "2"

[package]
name         = "signal-frame"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-frame"
description  = "Signal frame mechanics: envelope, length-prefixed rkyv archives, handshake, exchange identifiers, async correlation, streams, reply plumbing."
publish      = false

[lib]
name = "signal_frame"
path = "src/lib.rs"

[dependencies]
nota-codec = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame-macros = { version = "0.1", path = "macros" }
thiserror = "2"

[dev-dependencies]
trybuild = "1"

[lints.rust]
unsafe_code = "forbid"
unused = "warn"
dead_code = "warn"
