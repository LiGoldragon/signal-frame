[workspace]
members = [".", "macros"]
resolver = "2"

[package]
name         = "signal-frame"
version      = "0.3.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-frame"
description  = "Signal frame mechanics: envelope, length-prefixed rkyv archives, handshake, exchange identifiers, async correlation, streams, reply plumbing."
publish      = false

[lib]
name = "signal_frame"
path = "src/lib.rs"

[features]
default = []
nota-text = ["dep:nota"]

[dependencies]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", rev = "ce7c564de0a0518eaa1938d55dccc460a67cadb4", optional = true }
paste = "1"
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame-macros = { version = "0.1", path = "macros" }
thiserror = "2"

[dev-dependencies]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", rev = "ce7c564de0a0518eaa1938d55dccc460a67cadb4" }
trybuild = "1"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
