[package]
name         = "schema-rust"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-frame"
description  = "Rust composer for assembled Persona schemas."
publish      = false

[lib]
name = "schema_rust"
path = "src/lib.rs"

[dependencies]
proc-macro2 = "1"
quote       = "1"
schema      = { git = "https://github.com/LiGoldragon/schema.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
